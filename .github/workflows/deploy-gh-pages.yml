name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore gpt2-small web bundle cache
        id: gpt2-cache
        uses: actions/cache/restore@v4
        with:
          path: public/models/gpt2-small
          key: gpt2-small-web-gpt2-web-v1-${{ runner.os }}

      - name: Install
        run: npm ci
        env:
          SKIP_GPT2_WEB_FETCH: ${{ steps.gpt2-cache.outputs.cache-hit == 'true' && '1' || '' }}

      - name: Fetch gpt2-small weights (cache miss)
        if: steps.gpt2-cache.outputs.cache-hit != 'true'
        run: npm run fetch:gpt2-web

      - name: Save gpt2-small web bundle cache
        if: success() && steps.gpt2-cache.outputs.cache-hit != 'true' && hashFiles('public/models/gpt2-small/manifest.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/models/gpt2-small
          key: gpt2-small-web-gpt2-web-v1-${{ runner.os }}

      - name: Lint
        run: npm run lint

      - name: Build (GitHub Pages base path)
        run: npm run build:github

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


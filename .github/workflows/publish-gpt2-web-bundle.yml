# One-time (or occasional) publish: builds public/models/gpt2-small and uploads
# gpt2-small-web.tgz to release tag gpt2-web-v1 — used by npm postinstall (scripts/ensure-gpt2-web.mjs).
name: Publish GPT-2 web bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU torch + NumPy (export uses tensor.numpy().tobytes())
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy>=1.26,<3"

      - name: Export browser bundle
        run: python -u -m llm.prepare_course_model --out_dir public/models/gpt2-small

      - name: Verify browser bundle
        run: |
          test -f public/models/gpt2-small/manifest.json
          test -f public/models/gpt2-small/weights.f32.bin
          du -sh public/models/gpt2-small

      - name: Stage flat assets for in-browser Load model (when local public/ bundle missing)
        run: |
          cp public/models/gpt2-small/manifest.json browser-gpt2-manifest.json
          cp public/models/gpt2-small/tokenizer.json browser-gpt2-tokenizer.json
          cp public/models/gpt2-small/weights.f32.bin browser-gpt2-weights.f32.bin
          ls -lh browser-gpt2-*

      - name: Pack tarball
        run: |
          cd public/models
          tar czvf gpt2-small-web.tgz gpt2-small
          ls -lh gpt2-small-web.tgz
          test -f gpt2-small-web.tgz

      - name: Upload release asset
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: gpt2-web-v1
          target_commitish: ${{ github.sha }}
          name: GPT-2 small (browser f32 bundle)
          body: |
            Auto-built weights for the Vite app (`public/models/gpt2-small`).
            Includes `gpt2-small-web.tgz` (npm postinstall) and flat `browser-gpt2-*` files
            so **Load model** can fetch from this release when the site has no local bundle.
          files: |
            public/models/gpt2-small-web.tgz
            browser-gpt2-manifest.json
            browser-gpt2-tokenizer.json
            browser-gpt2-weights.f32.bin
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
